<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exércicio 14</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
        <div x-data="{branco : false}">
            <button @click="branco = !branco">  
                <span x-show="!branco">❤️</span>
                <span x-show="branco">🤍</span>
            </button>
        </div>
    
</body>
</html>
