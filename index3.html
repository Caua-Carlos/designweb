<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    

<body>
<!-- 1. O CÉREBRO (Estado Inicial) -->
<div x-data="{ texto: '' }">

  <!-- 2. A CONEXÃO (Input <-> Var) -->
  <textarea x-model="texto"></textarea>

  <div>
    <!-- 3. O FEEDBACK (Texto e Cor) -->
    <span 
      x-text="texto.length + '/20'"
      :class="texto.length > 20 
              ? 'text-red-600' 
              : 'text-gray-400'">
    </span>

    <!-- 4. O GUARDA (Bloqueio) -->
    <button 
      :disabled="texto.length === 0 || 
                 texto.length > 20">
      Tweetar
    </button>
  </div>

</div>
</body>
</html>
