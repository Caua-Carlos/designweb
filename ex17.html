<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exércicio 17</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div x-data="{modal : false}" class="text-center mt-5 ">
        <button @click="modal = true" class="border border-black border-2 p-5 rounded-2xl hover:text-xl transition-all duration-400">Abrir modal</button>
        <div x-show="modal" class="bg-neutral-900 p-5 text-[#FFFFFF] mt-5 ">
            <button @click="modal = false" class="border border-1  p-5 rounded-2xl hover:text-xl  transition-all duration-400 ">Fechar modal</button>
        </div>
    </div>
    
</body>
</html>
