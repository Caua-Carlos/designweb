<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exércicio 10</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{mensagem : 'Passe o mouse aqui!'}">
       <span x-text="mensagem" @mouseenter="mensagem ='Entrou!'" @mouseleave="mensagem = 'Saiu!'"></span>
    </div>
    
    
</body>
</html>
