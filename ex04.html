<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Document</title>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<script>
document.addEventListener('alpine:init', () => {
  Alpine.store('tasks', {
    items: [
      { text: 'Aprender Alpine.js', done: true },
      { text: 'Criar Store Global', done: false },
      { text: 'Finalizar Projeto', done: false }
    ],

    filter: 'all',

    get filtered() {
      if (this.filter === 'done') {
        return this.items.filter(item => item.done)
      }

      if (this.filter === 'todo') {
        return this.items.filter(item => !item.done)
      }

      return this.items
    },

    get pendingCount() {
      return this.items.filter(item => !item.done).length
    },

    add(text) {
      if (text !== '') {
        this.items.push({ text, done: false })
      }
    }
  })
})
</script>

<div x-data class="bg-white w-[420px] p-6 rounded-xl shadow">

  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Minhas Tarefas</h1>

    <span
      class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-bold"
      x-text="$store.tasks.pendingCount + ' pendentes'"
    ></span>
  </div>

  <div class="flex gap-2 mb-4">
    <input
      x-ref="input"
      placeholder="Nova tarefa..."
      class="border rounded-lg p-2 flex-1"
    >
    <button
      class="bg-blue-600 w-10 rounded-lg text-white font-bold"
      @click="$store.tasks.add($refs.input.value); $refs.input.value=''"
    >
      +
    </button>
  </div>


  <div class="flex gap-2 mb-4">
    <button
      class="px-4 py-1 rounded-full font-bold text-gray-500"
      :class="$store.tasks.filter==='all' ? 'bg-black text-white' : 'bg-gray-200'"
      @click="$store.tasks.filter='all'"
    >
      Todas
    </button>

    <button
      class="px-4 py-1 rounded-full font-bold text-gray-500"
      :class="$store.tasks.filter==='todo' ? 'bg-black text-white' : 'bg-gray-200'"
      @click="$store.tasks.filter='todo'"
    >
      Pendentes
    </button>

    <button
      class="px-4 py-1 rounded-full font-bold text-gray-500"
      :class="$store.tasks.filter==='done' ? 'bg-black text-white' : 'bg-gray-200'"
      @click="$store.tasks.filter='done'"
    >
      Feitas
    </button>
  </div>

  <template x-for="item in $store.tasks.filtered" :key="item.text">
    <div class="flex items-center gap-3 p-3 border rounded-lg mb-2">
      <input type="checkbox" x-model="item.done">

      <span
        x-text="item.text"
        :class="item.done && 'line-through text-gray-400'"
      ></span>
    </div>
  </template>

</div>

</body>
</html>
